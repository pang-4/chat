apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chat-app
  namespace: chat
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - chat
  selector:
    matchLabels:
      app: chat-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
