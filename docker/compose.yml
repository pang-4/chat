x-chat-image: &chat-image
  image: chat-app:local
  build:
    context: ../app
    dockerfile: ../docker/Dockerfile

x-chat-environment: &chat-environment
  env_file:
    - ../app/.env
  environment:
    DB_HOST: postgres
    MIGRATIONS_SOURCE_URL: file://migrations

services:
  postgres:
    image: postgres:17
    container_name: chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-chat}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: [*chat-image, *chat-environment]
    container_name: chat-migrate
    command: ["migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: [*chat-image, *chat-environment]
    container_name: chat-app
    command: ["server"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
