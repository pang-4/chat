name: CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "docker/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "docker/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go test and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Download Go modules
        working-directory: app
        run: go mod download

      - name: Check Go formatting
        working-directory: app
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Run Go vet
        working-directory: app
        run: go vet ./...

      - name: Run Go tests
        working-directory: app
        run: go test -race -cover ./...

      - name: Build Go commands
        working-directory: app
        run: go build ./cmd/server ./cmd/migrate

      - name: Build Docker image
        run: |
          docker build \
            --file docker/Dockerfile \
            --tag chat-app:ci \
            app

  publish:
    name: Publish Docker image to GHCR
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/chat-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build \
            --file docker/Dockerfile \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:latest" \
            app

          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"

  update-manifest:
    name: Update GitOps image tag
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/chat-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Update Helm chart image tag
        shell: bash
        run: |
          sed -i -E \
            "s#^(\s*tag:) .+#\1 ${GITHUB_SHA}#" \
            helm/chat/values.yaml

          git diff --check

      - name: Commit and push manifest
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Helm chart already uses ${GITHUB_SHA}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            helm/chat/values.yaml

          git commit \
            -m "deploy: update image to ${GITHUB_SHA::7} [skip ci]"

          git push origin HEAD:main
