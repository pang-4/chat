apiVersion: v1
kind: Service
metadata:
  name: chat-app
  namespace: {{ .Release.Namespace }}
  labels:
    app: chat-app
    {{- include "chat.labels" . | nindent 4 }}
spec:
  type: {{ .Values.chat.service.type }}
  selector:
    app: chat-app
  ports:
    - name: http
      port: {{ .Values.chat.service.port }}
      targetPort: http
