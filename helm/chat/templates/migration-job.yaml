{{- if .Values.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: chat-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chat.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: chat-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.chat.image.repository }}:{{ .Values.chat.image.tag }}"
          imagePullPolicy: {{ .Values.chat.image.pullPolicy }}
          command:
            {{- toYaml .Values.migrationJob.command | nindent 12 }}
          env:
            - name: DB_HOST
              value: {{ .Values.chat.config.DB_HOST | quote }}
            - name: DB_PORT
              value: {{ .Values.chat.config.DB_PORT | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: DB_NAME
            - name: DB_SSLMODE
              value: {{ .Values.chat.config.DB_SSLMODE | quote }}
            - name: MIGRATIONS_SOURCE_URL
              value: {{ .Values.migrationJob.sourceURL | quote }}
          resources:
            {{- toYaml .Values.migrationJob.resources | nindent 12 }}
{{- end }}
